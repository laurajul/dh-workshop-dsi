<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Noto Sans, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-weight="bold">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#fff"/>

  <!-- level 3: viewers (coral) -->
  <g fill="#fff" stroke="#FF7F50" stroke-width="2.2">
    <rect x="95" y="20" width="220" height="86" rx="12"/>
    <rect x="340" y="20" width="220" height="86" rx="12"/>
    <rect x="585" y="20" width="220" height="86" rx="12"/>
  </g>
  <g fill="#FF7F50" text-anchor="middle">
    <text x="205" y="58" font-size="20">Viewer</text><text x="205" y="84" font-size="14">e.g. Mirador</text>
    <text x="450" y="58" font-size="20">Viewer</text><text x="450" y="84" font-size="14">e.g. Universal Viewer</text>
    <text x="695" y="58" font-size="20">Website or tool</text><text x="695" y="84" font-size="14">e.g. your own</text>
  </g>

  <!-- level 2: the APIs (rosybrown, dashed: they point to others rather than contain them) -->
  <rect x="30" y="170" width="840" height="76" rx="12" fill="#fff" stroke="#BC8F8F" stroke-width="2.2" stroke-dasharray="9 6"/>
  <g fill="#BC8F8F" text-anchor="middle">
    <text x="450" y="204" font-size="20">IIIF APIs</text>
    <text x="450" y="230" font-size="14">Presentation API (structure, metadata) · Image API (pixels)</text>
  </g>

  <!-- level 1: institutions (silver) -->
  <g fill="#fff" stroke="#C0C0C0" stroke-width="2.2">
    <rect x="30" y="320" width="190" height="86" rx="12"/>
    <rect x="245" y="320" width="190" height="86" rx="12"/>
    <rect x="465" y="320" width="190" height="86" rx="12"/>
    <rect x="680" y="320" width="190" height="86" rx="12"/>
  </g>
  <g fill="#C0C0C0" text-anchor="middle">
    <text x="125" y="358" font-size="20">Library</text><text x="125" y="384" font-size="14">images + metadata</text>
    <text x="340" y="358" font-size="20">Archive</text><text x="340" y="384" font-size="14">images + metadata</text>
    <text x="560" y="358" font-size="20">Museum</text><text x="560" y="384" font-size="14">images + metadata</text>
    <text x="775" y="358" font-size="20">Gallery</text><text x="775" y="384" font-size="14">images + metadata</text>
  </g>

  <!-- arrows -->
  <g stroke="#444" stroke-width="2.2" fill="none" marker-end="url(#arr)">
    <line x1="125" y1="318" x2="125" y2="248"/>
    <line x1="340" y1="318" x2="340" y2="248"/>
    <line x1="560" y1="318" x2="560" y2="248"/>
    <line x1="775" y1="318" x2="775" y2="248"/>
    <line x1="205" y1="168" x2="205" y2="108"/>
    <line x1="450" y1="168" x2="450" y2="108"/>
    <line x1="695" y1="168" x2="695" y2="108"/>
  </g>
</svg>
